<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Wingo AI LSTM (Web)</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --green: #22c55e;
      --red: #ef4444;
      --orange: #f97316;
      --text: #e2e8f0;
      --muted: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 16px;
      line-height: 1.45;
    }
    .container { max-width: 540px; margin: 0 auto; }
    h1 {
      font-size: 1.35rem;
      text-align: center;
      color: var(--accent);
      margin-bottom: 2px;
    }
    .subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 0.82rem;
      margin-bottom: 18px;
    }
    .card {
      background: var(--card);
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 14px;
      border: 1px solid var(--border);
    }
    .input-group { display: flex; gap: 8px; margin-bottom: 10px; }
    input[type="text"] {
      flex: 1;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #0f172a;
      color: var(--text);
      font-size: 1rem;
      outline: none;
    }
    input[type="text"]:focus { border-color: var(--accent); }
    button {
      padding: 12px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.92rem;
    }
    button:hover { filter: brightness(1.08); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.secondary {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    button.danger { background: var(--red); color: #fff; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .actions button { flex: 1; min-width: 70px; }
    .history {
      font-family: monospace;
      font-size: 1.05rem;
      letter-spacing: 1px;
      word-break: break-all;
      background: #0f172a;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
    }
    .meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.84rem;
      color: var(--muted);
      margin-bottom: 12px;
    }
    .methods { display: flex; flex-direction: column; gap: 7px; }
    .method {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 9px 12px;
      background: #0f172a;
      border-radius: 10px;
      border-left: 4px solid var(--border);
    }
    .method.best { border-left-color: var(--green); }
    .method .name { font-weight: 600; min-width: 36px; }
    .pred { font-weight: 600; }
    .pred.besar { color: var(--orange); }
    .pred.kecil { color: var(--accent); }
    .detail { font-size: 0.78rem; color: var(--muted); }
    .eval {
      font-size: 0.88rem;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 12px;
    }
    .ok { color: var(--green); }
    .bad { color: var(--red); }
    .streak-w { color: var(--green); font-size: 0.8rem; }
    .streak-l { color: var(--red); font-size: 0.8rem; }
    .status {
      text-align: center;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
    }
    .status.training { color: var(--orange); }
    footer {
      text-align: center;
      color: var(--muted);
      font-size: 0.75rem;
      margin-top: 18px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Wingo AI LSTM (Web)</h1>
    <p class="subtitle">TensorFlow.js • LSTM + localStorage</p>

    <div class="card">
      <div class="input-group">
        <input type="text" id="inputDigit" placeholder="20 digit awal / 1 digit..." maxlength="20" autocomplete="off"/>
        <button id="btnSend" onclick="processInput()">Kirim</button>
      </div>
      <div class="actions">
        <button class="secondary" onclick="showStats()">Stats</button>
        <button class="secondary" onclick="forceRetrain()">Retrain</button>
        <button class="danger" onclick="resetAll()">Reset</button>
      </div>
      <div class="status" id="status">Memuat...</div>
    </div>

    <div class="card" id="resultCard" style="display:none">
      <div class="eval" id="evalBox"></div>
      <div class="history" id="historyBox"></div>
      <div class="meta">
        <span id="bkCount"></span>
        <span id="streakInfo"></span>
      </div>
      <div class="methods" id="methodsBox"></div>
      <div style="margin-top:12px;font-size:0.85rem" id="winrateBox"></div>
    </div>

    <div class="card" id="statsCard" style="display:none">
      <h3 style="margin-bottom:10px;font-size:1rem">📊 Statistik + Streak</h3>
      <div id="statsGrid"></div>
      <div style="margin-top:12px" id="bestBox"></div>
    </div>

    <footer>Data tersimpan otomatis di browser (localStorage)</footer>
  </div>

<script>
// ================== CONFIG ==================
const SEQ_LEN = 12;
const N_FEATURES = 4;
const RETRAIN_EVERY = 15;
const MAX_DIGITS = 60;
const DISPLAY = 20;
const STORAGE_KEY = "wingo_lstm_web_v2";
const MODEL_KEY = "wingo_lstm_model_v2";

// ================== STATE ==================
let digits = [];
let globalHistory = [];
let model = null;
let isTraining = false;
let totalPrediksi = 0;
let stats = {
  M1: {benar:0, total:0, win:0, lose:0},
  M2: {benar:0, total:0, win:0, lose:0},
  M3: {benar:0, total:0, win:0, lose:0},
  M4: {benar:0, total:0, win:0, lose:0},
  M5: {benar:0, total:0, win:0, lose:0},
  AI: {benar:0, total:0, win:0, lose:0},
};
let lastPreds = null;
let consecutiveLoss = 0;

// ================== LOCAL STORAGE ==================
function saveState() {
  const data = {
    digits,
    globalHistory,
    stats,
    consecutiveLoss,
    totalPrediksi,
    lastPreds,
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  } catch (e) {
    console.warn("Gagal simpan state:", e);
  }
}

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return false;
    const data = JSON.parse(raw);
    digits = data.digits || [];
    globalHistory = data.globalHistory || [];
    stats = data.stats || stats;
    consecutiveLoss = data.consecutiveLoss || 0;
    totalPrediksi = data.totalPrediksi || 0;
    lastPreds = data.lastPreds || null;
    return true;
  } catch (e) {
    console.warn("Gagal load state:", e);
    return false;
  }
}

async function saveModel() {
  if (!model) return;
  try {
    await model.save(`localstorage://${MODEL_KEY}`);
  } catch (e) {
    console.warn("Gagal simpan model:", e);
  }
}

async function loadModel() {
  try {
    const models = await tf.io.listModels();
    const key = `localstorage://${MODEL_KEY}`;
    if (models[key]) {
      model = await tf.loadLayersModel(key);
      return true;
    }
  } catch (e) {
    console.warn("Gagal load model:", e);
  }
  return false;
}

// ================== HELPERS ==================
function besarKecil(n) { return n >= 5 ? "Besar" : "Kecil"; }
function fmtPred(bk, angka) {
  return `<span class="pred ${bk.toLowerCase()}">${bk.toUpperCase()} (${angka})</span>`;
}
function streakSpan(s) {
  if (s.win > 0) return `<span class="streak-w">W${s.win}</span>`;
  if (s.lose > 0) return `<span class="streak-l">L${s.lose}</span>`;
  return "";
}
function setStatus(msg, training=false) {
  const el = document.getElementById("status");
  el.textContent = msg;
  el.className = "status" + (training ? " training" : "");
}

// ================== FEATURES ==================
function makeFeatures(seq) {
  const feats = [];
  for (let i = 0; i < seq.length; i++) {
    const d = seq[i];
    const isBig = d >= 5 ? 1 : 0;
    let delta = 0, isChange = 0;
    if (i + 1 < seq.length) {
      const prev = seq[i + 1];
      delta = (d - prev) / 9;
      isChange = (isBig !== (prev >= 5 ? 1 : 0)) ? 1 : 0;
    }
    feats.push([d / 9, isBig, delta, isChange]);
  }
  return feats;
}

// ================== LSTM ==================
function buildModel() {
  const m = tf.sequential();
  m.add(tf.layers.lstm({
    units: 32,
    returnSequences: false,
    inputShape: [SEQ_LEN, N_FEATURES]
  }));
  m.add(tf.layers.dropout({rate: 0.25}));
  m.add(tf.layers.dense({units: 12, activation: "relu"}));
  m.add(tf.layers.dense({units: 1, activation: "sigmoid"}));
  m.compile({
    optimizer: tf.train.adam(0.001),
    loss: "binaryCrossentropy",
    metrics: ["accuracy"]
  });
  return m;
}

async function prepareTrainingData() {
  if (globalHistory.length < SEQ_LEN + 5) return null;
  const xs = [], ys = [];
  for (let i = 0; i <= globalHistory.length - SEQ_LEN - 1; i++) {
    const window = globalHistory.slice(i, i + SEQ_LEN);
    const target = globalHistory[i + SEQ_LEN];
    const nf = window.slice().reverse();
    xs.push(makeFeatures(nf));
    ys.push(target >= 5 ? 1 : 0);
  }
  if (xs.length < 8) return null;
  return {
    xTensor: tf.tensor3d(xs),
    yTensor: tf.tensor2d(ys, [ys.length, 1]),
    count: xs.length
  };
}

async function retrainModel(force=false) {
  if (isTraining) return;
  if (!force && globalHistory.length < 30) {
    setStatus(`Data: ${globalHistory.length} • Butuh min 30 untuk train`);
    return;
  }
  isTraining = true;
  setStatus("⏳ Sedang training LSTM...", true);
  document.getElementById("btnSend").disabled = true;

  try {
    const data = await prepareTrainingData();
    if (!data) {
      setStatus("Data masih kurang untuk training");
      return;
    }
    if (!model) model = buildModel();

    const yArr = await data.yTensor.data();
    let c0=0, c1=0;
    for (let v of yArr) v===0 ? c0++ : c1++;
    const total = c0 + c1;
    const w0 = Math.min(Math.max(total/(2*(c0||1)), 0.7), 1.6);
    const w1 = Math.min(Math.max(total/(2*(c1||1)), 0.7), 1.6);

    await model.fit(data.xTensor, data.yTensor, {
      epochs: 18,
      batchSize: 12,
      shuffle: true,
      classWeight: {0:w0, 1:w1},
      verbose: 0
    });
    data.xTensor.dispose();
    data.yTensor.dispose();

    await saveModel();
    setStatus(`✅ Model siap • ${data.count} sample • ${globalHistory.length} digit`);
  } catch (err) {
    console.error(err);
    setStatus("⚠️ Gagal training: " + err.message);
  } finally {
    isTraining = false;
    document.getElementById("btnSend").disabled = false;
  }
}

async function predictAI() {
  if (!model || digits.length < SEQ_LEN) {
    return metodeAIFallback(digits);
  }
  try {
    const window = digits.slice(0, SEQ_LEN);
    const feats = makeFeatures(window);
    const input = tf.tensor3d([feats]);
    const prob = (await model.predict(input).data())[0];
    input.dispose();
    const bk = prob > 0.5 ? "Besar" : "Kecil";
    const kandidat = bk === "Besar" ? [5,6,7,8,9] : [0,1,2,3,4];
    const freq = {};
    digits.slice(0,20).forEach(x => freq[x]=(freq[x]||0)+1);
    let angka = kandidat[0], maxf = -1;
    kandidat.forEach(x => { if ((freq[x]||0)>maxf){maxf=freq[x]||0; angka=x;} });
    return {bk, angka, detail:`P(B)=${prob.toFixed(2)}`};
  } catch (e) {
    return metodeAIFallback(digits);
  }
}

function metodeAIFallback(d) {
  if (d.length < 5) return {bk:"Besar", angka:5, detail:"data kurang"};
  let tbb=0,tbk=0,tkb=0,tkk=0;
  for (let i=0;i<d.length-1;i++) {
    const c=d[i], n=d[i+1];
    if (c>=5) { n>=5 ? tbb++ : tbk++; }
    else      { n>=5 ? tkb++ : tkk++; }
  }
  const last = d[0];
  const pB = last>=5 ? (tbb+1)/(tbb+tbk+2) : (tkb+1)/(tkb+tkk+2);
  const bk = pB > 0.5 ? "Besar" : "Kecil";
  const kandidat = bk==="Besar" ? [5,6,7,8,9] : [0,1,2,3,4];
  const freq = {};
  d.slice(0,20).forEach(x => freq[x]=(freq[x]||0)+1);
  let angka=kandidat[0], maxf=-1;
  kandidat.forEach(x => { if((freq[x]||0)>maxf){maxf=freq[x]||0; angka=x;} });
  return {bk, angka, detail:`NB P(B)=${pB.toFixed(2)}`};
}

// ================== METHODS ==================
function metode1(d) {
  const w = d.slice(0,20);
  const besar = w.filter(x=>x>=5).length;
  const kecil = w.length - besar;
  const bk = besar > kecil ? "Kecil" : "Besar";
  const freq = {};
  w.forEach(x => freq[x]=(freq[x]||0)+1);
  let angka=0, minf=Infinity;
  for (let i=0;i<10;i++) if((freq[i]||0)<minf){minf=freq[i]||0; angka=i;}
  return {bk, angka, detail:`B=${besar} K=${kecil}`};
}

function metode2(d) {
  const trans = {};
  for (let i=0;i<d.length-1;i++) {
    const a=d[i], b=d[i+1];
    if (!trans[a]) trans[a]={};
    trans[a][b]=(trans[a][b]||0)+1;
  }
  const state = d[0];
  if (!trans[state]) return {bk:"Besar", angka:5, detail:`State ${state} baru`};
  let angka=5, maxc=-1;
  for (const [k,v] of Object.entries(trans[state])) {
    if (v>maxc){maxc=v; angka=+k;}
  }
  return {bk:besarKecil(angka), angka, detail:`dari ${state}`};
}

function metode3(d) {
  const s=d.slice(0,5), l=d.slice(0,15);
  const maS=s.reduce((a,b)=>a+b,0)/s.length;
  const maL=l.reduce((a,b)=>a+b,0)/l.length;
  const tren = maS>maL ? "Naik" : "Turun";
  const bk = tren==="Naik" ? "Besar" : "Kecil";
  const kand = tren==="Naik" ? [5,6,7,8,9] : [0,1,2,3,4];
  let angka=kand[0], best=Infinity;
  kand.forEach(x=>{if(Math.abs(x-maS)<best){best=Math.abs(x-maS);angka=x;}});
  return {bk, angka, detail:tren};
}

function metode4(d) {
  const w=d.slice(0,10);
  let berg=0;
  for (let i=0;i<w.length-1;i++) if((w[i]>=5)!==(w[i+1]>=5)) berg++;
  const rasio = w.length>1 ? berg/(w.length-1) : 0;
  const last=d[0];
  const bk = rasio>0.5 ? (last>=5?"Kecil":"Besar") : besarKecil(last);
  const kand = bk==="Besar" ? [5,6,7,8,9] : [0,1,2,3,4];
  const freq={};
  d.slice(0,20).forEach(x=>freq[x]=(freq[x]||0)+1);
  let angka=kand[0], maxf=-1;
  kand.forEach(x=>{if((freq[x]||0)>maxf){maxf=freq[x]||0;angka=x;}});
  return {bk, angka, detail:`rasio ${rasio.toFixed(2)}`};
}

function metode5(hasil, ai) {
  const all = [...hasil, {...ai, kode:"AI"}];
  const score = {Besar:0, Kecil:0};
  all.forEach(h => {
    const s = stats[h.kode] || {benar:0,total:0};
    const acc = s.total>=5 ? s.benar/s.total : 0.5;
    let w = acc;
    if (h.kode==="AI" && acc>=0.55) w *= 1.35;
    score[h.bk] += w;
  });
  const bk = score.Besar >= score.Kecil ? "Besar" : "Kecil";
  const kandidat = all.filter(h=>h.bk===bk).map(h=>h.angka);
  const freq={};
  kandidat.forEach(a=>freq[a]=(freq[a]||0)+1);
  let angka=kandidat[0]||5, maxf=-1;
  for (const [k,v] of Object.entries(freq)) if(v>maxf){maxf=v;angka=+k;}
  return {bk, angka, detail:`wB=${score.Besar.toFixed(2)} wK=${score.Kecil.toFixed(2)}`};
}

// ================== CORE ==================
async function predict() {
  const h1=metode1(digits); h1.kode="M1";
  const h2=metode2(digits); h2.kode="M2";
  const h3=metode3(digits); h3.kode="M3";
  const h4=metode4(digits); h4.kode="M4";
  const ai=await predictAI(); ai.kode="AI";
  const h5=metode5([h1,h2,h3,h4], ai); h5.kode="M5";

  let finalBK=h5.bk, finalAngka=h5.angka, reversed=false;
  if (consecutiveLoss >= 3) {
    finalBK = finalBK==="Besar" ? "Kecil" : "Besar";
    const kand = finalBK==="Besar" ? [5,6,7,8,9] : [0,1,2,3,4];
    const freq={};
    digits.slice(0,20).forEach(x=>freq[x]=(freq[x]||0)+1);
    finalAngka = kand.reduce((a,b)=>(freq[b]||0)>(freq[a]||0)?b:a);
    reversed = true;
  }
  return {h1,h2,h3,h4,h5,ai, finalBK, finalAngka, reversed};
}

function evaluate(actual) {
  if (!lastPreds) return "";
  const aktual = besarKecil(actual);
  let html = `Evaluasi (Asli: <b>${aktual}</b> / ${actual}) `;
  ["M1","M2","M3","M4","M5","AI"].forEach(kode => {
    const pred = lastPreds[kode];
    const s = stats[kode];
    s.total++;
    if (pred === aktual) {
      s.benar++; s.win++; s.lose=0;
      html += `<span class="ok">✅${kode}</span> `;
    } else {
      s.lose++; s.win=0;
      html += `<span class="bad">❌${kode}</span> `;
    }
  });
  if (lastPreds.M5 === aktual) consecutiveLoss = 0;
  else consecutiveLoss++;
  html += `🔥 ${consecutiveLoss}x`;
  return html;
}

function render(pred, evalHtml="") {
  document.getElementById("resultCard").style.display = "block";
  document.getElementById("statsCard").style.display = "none";
  document.getElementById("evalBox").innerHTML = evalHtml;

  const show = digits.slice(0, DISPLAY).join("");
  document.getElementById("historyBox").textContent =
    show + (digits.length > DISPLAY ? `  (${digits.length}d)` : "");

  const big = digits.filter(x=>x>=5).length;
  document.getElementById("bkCount").textContent = `${big}B / ${digits.length-big}K`;
  document.getElementById("streakInfo").textContent = `🔥 ${consecutiveLoss}x`;

  const list = [
    {k:"M1", h:pred.h1},
    {k:"M2", h:pred.h2},
    {k:"M3", h:pred.h3},
    {k:"M4", h:pred.h4},
    {k:"M5", h:{bk:pred.finalBK, angka:pred.finalAngka, detail:pred.h5.detail+(pred.reversed?" ⚡":"")}},
    {k:"AI", h:pred.ai},
  ];
  let html = "";
  list.forEach((m,i) => {
    html += `<div class="method ${m.k==="M5"?"best":""}">
      <div>
        <span class="name">${i+1} ${m.k}</span>
        ${fmtPred(m.h.bk, m.h.angka)}
        <div class="detail">${m.h.detail||""}</div>
      </div>
    </div>`;
  });
  document.getElementById("methodsBox").innerHTML = html;

  let wr = "";
  ["M1","M2","M3","M4","M5","AI"].forEach(k => {
    const s = stats[k];
    if (s.total===0) return;
    const pct = (s.benar/s.total*100).toFixed(0);
    wr += `<div>${k}: ${s.benar}/${s.total} (${pct}%) ${streakSpan(s)}</div>`;
  });
  document.getElementById("winrateBox").innerHTML = wr || "<span style='color:var(--muted)'>Belum ada statistik</span>";
}

async function processInput() {
  const raw = document.getElementById("inputDigit").value.trim();
  if (!raw) return;

  if (digits.length === 0) {
    if (raw.length !== 20 || !/^\d{20}$/.test(raw)) {
      alert("Kirim tepat 20 digit untuk memulai");
      return;
    }
    digits = raw.split("").map(Number);
    globalHistory = digits.slice().reverse();
    const pred = await predict();
    lastPreds = {
      M1:pred.h1.bk, M2:pred.h2.bk, M3:pred.h3.bk,
      M4:pred.h4.bk, M5:pred.finalBK, AI:pred.ai.bk
    };
    render(pred);
    saveState();
    if (globalHistory.length >= 30) await retrainModel();
  } else {
    if (raw.length !== 1 || !/^\d$/.test(raw)) {
      alert("Kirim 1 digit saja");
      return;
    }
    const actual = +raw;
    const evalHtml = evaluate(actual);

    digits.unshift(actual);
    if (digits.length > MAX_DIGITS) digits.pop();
    globalHistory.push(actual);
    totalPrediksi++;

    saveState();

    if (globalHistory.length % RETRAIN_EVERY === 0) {
      await retrainModel();
    }

    const pred = await predict();
    lastPreds = {
      M1:pred.h1.bk, M2:pred.h2.bk, M3:pred.h3.bk,
      M4:pred.h4.bk, M5:pred.finalBK, AI:pred.ai.bk
    };
    render(pred, evalHtml);
    saveState();
  }

  document.getElementById("inputDigit").value = "";
  document.getElementById("inputDigit").focus();
}

function showStats() {
  document.getElementById("resultCard").style.display = "none";
  document.getElementById("statsCard").style.display = "block";
  let html = "", best=null, bestAcc=-1;
  ["M1","M2","M3","M4","M5","AI"].forEach(k => {
    const s = stats[k];
    if (s.total===0) {
      html += `<div style="margin:4px 0">${k}: belum ada</div>`;
      return;
    }
    const acc = s.benar/s.total;
    if (acc > bestAcc) { bestAcc=acc; best=k; }
    html += `<div style="margin:4px 0">${k}: ${(acc*100).toFixed(0)}% (${s.benar}/${s.total}) ${streakSpan(s)}</div>`;
  });
  document.getElementById("statsGrid").innerHTML = html;
  document.getElementById("bestBox").innerHTML = best
    ? `🏆 Terbaik: <b>${best}</b> (${(bestAcc*100).toFixed(0)}%)`
    : "";
}

async function forceRetrain() {
  if (globalHistory.length < 20) {
    alert("Data masih terlalu sedikit (min 20)");
    return;
  }
  await retrainModel(true);
}

async function resetAll() {
  if (!confirm("Reset semua data & model?")) return;
  digits = [];
  globalHistory = [];
  if (model) { model.dispose(); model = null; }
  stats = {
    M1:{benar:0,total:0,win:0,lose:0},
    M2:{benar:0,total:0,win:0,lose:0},
    M3:{benar:0,total:0,win:0,lose:0},
    M4:{benar:0,total:0,win:0,lose:0},
    M5:{benar:0,total:0,win:0,lose:0},
    AI:{benar:0,total:0,win:0,lose:0},
  };
  lastPreds = null;
  consecutiveLoss = 0;
  totalPrediksi = 0;

  localStorage.removeItem(STORAGE_KEY);
  try {
    const models = await tf.io.listModels();
    const key = `localstorage://${MODEL_KEY}`;
    if (models[key]) await tf.io.removeModel(key);
  } catch(e){}

  document.getElementById("resultCard").style.display = "none";
  document.getElementById("statsCard").style.display = "none";
  setStatus("Model: belum dilatih • Data dihapus");
}

// ================== INIT ==================
document.getElementById("inputDigit").addEventListener("keydown", e => {
  if (e.key === "Enter") processInput();
});

(async function init() {
  setStatus("Memuat data...");
  const hasData = loadState();
  const hasModel = await loadModel();

  if (hasData && digits.length > 0) {
    // restore tampilan
    const pred = await predict();
    render(pred);
    if (hasModel) {
      setStatus(`✅ Data & model dimuat • ${globalHistory.length} digit`);
    } else {
      setStatus(`Data dimuat (${globalHistory.length} digit) • Model belum ada`);
      if (globalHistory.length >= 30) await retrainModel();
    }
  } else {
    setStatus("Siap • TensorFlow.js loaded");
  }
})();
</script>
